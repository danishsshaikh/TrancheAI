services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trancheai}
      POSTGRES_USER: ${POSTGRES_USER:-trancheai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - trancheai-postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trancheai} -d ${POSTGRES_DB:-trancheai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://trancheai:change-me@db:5432/trancheai}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      STT_ENABLED: ${STT_ENABLED:-false}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_MODEL: ${STT_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8100}:8100"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3100}:80"

volumes:
  trancheai-postgres:
